# Les Alpages du Soleil: single source of truth for every fact on the site.
# Rules (same as Dolce & Azzurra):
#   - Pages read facts from this file; never retype them.
#   - TODO_OWNER = unknown. Do NOT invent it: omit the element and list it in the build report.
#   - verified: false = single source; show it, but list it in the build report.
# The verifier and owner-todo scripts read this file (scripts/lib/site.mjs).

site:
  domain: "https://www.lesalpagesdusoleil.com"   # owner to confirm this is the Nuxit domain
  cname: "www.lesalpagesdusoleil.com"
  default_locale: fr                              # French at the root (/), other languages in folders
  locales:
    - { code: fr, name: Français,   status: live,  reviewer: owner }
    - { code: en, name: English,    status: live,  reviewer: owner }
    - { code: de, name: Deutsch,    status: draft, reviewer: native-freelancer }
    - { code: nl, name: Nederlands, status: draft, reviewer: native-freelancer }
  legacy_lang_param: true   # the old site used /?lang=en etc.

